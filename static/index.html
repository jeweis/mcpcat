<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/ui/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="mcpcat MCP服务器管理前端">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mcpcat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>mcpcat</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.mcpcatAppsPreviewReady = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.type = 'module';
      script.src = new URL('apps-preview.js', document.baseURI).href;
      script.onload = () => resolve();
      script.onerror = () => reject(new Error('Apps preview module unavailable'));
      document.head.append(script);
    });
    // Preserve a rejected promise for an explicit preview retry without a global rejection.
    window.mcpcatAppsPreviewReady.catch(() => {});
    window.mcpcatSkillUploadReady = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.type = 'module';
      script.src = new URL('skill-upload.js', document.baseURI).href;
      script.onload = resolve;
      script.onerror = () => reject(new Error('Skill upload module unavailable'));
      document.head.append(script);
    });
    window.mcpcatSkillUploadReady.catch(() => {});
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
