name: CLI CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - "cli/**"
      - ".github/workflows/cli-*.yml"
      - ".github/scripts/cli-*.mjs"
  push:
    branches: [main, master]
    paths:
      - "cli/**"
      - ".github/workflows/cli-*.yml"
      - ".github/scripts/cli-*.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 / pnpm validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml

      - name: Verify Node, npm, and pnpm release toolchain
        run: node ../.github/scripts/cli-verify-toolchain.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Inspect npm package dry run
        run: npm pack --dry-run --ignore-scripts

      - name: Verify package metadata, contents, and secrets
        run: node ../.github/scripts/cli-verify-package.mjs

      - name: Test packed CLI end to end
        run: node ../.github/scripts/cli-package-e2e.mjs

      - name: Verify release isolation and dist-tag policy
        run: node ../.github/scripts/cli-verify-release-policy.mjs

      - name: Verify Gate C documentation and compatibility matrix
        run: node ../.github/scripts/cli-verify-gate-c-docs.mjs
