[project]
name = "jewei-mcpcat"
version = "1.0.1"
description = "MCP聚合平台 - 支持多种MCP协议的统一管理平台"
authors = [
    {name = "mcpcat Team", email = "team@mcpcat.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.133.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.12.0",
    "python-multipart>=0.0.12",
    "requests>=2.32.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.1",
    "fastmcp[apps,code-mode]==4.1.0",
    "fastmcp-tasks==4.1.0",
    "jsonschema>=4.26,<5",
    "prefab-ui==0.20.2",
    "pydantic-monty==1.1.0",
    "tinycss2==1.5.1",
    "tree-sitter==0.25.2",
    "tree-sitter-javascript==0.25.0",
    "httpx2>=2.5,<3",
    "httpx>=0.24.0",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "filelock>=3.16,<4",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[project.scripts]
jewei-mcpcat = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
